.glass,.card,.tw,.lbox,.md,#side,#topbar{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--gb);box-shadow:var(--sh)}

.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(139,109,240,.42)}.btn:active{transform:none}
.btn.gr{background:rgba(255,255,255,.7);color:var(--pd);box-shadow:inset 0 0 0 1.5px rgba(139,109,240,.35)}
.btn.lf{background:linear-gradient(135deg,#b49dff,#7c5cd6)}
.ib{border:0;background:none;font-size:16px;cursor:pointer;opacity:.75;transition:.15s}.ib:hover{opacity:1;transform:scale(1.15)}
input,select,textarea{font:600 14px 'Plus Jakarta Sans',sans-serif;width:100%;padding:10px 14px;border:1.5px solid rgba(139,109,240,.25);border-radius:14px;background:rgba(255,255,255,.75);color:var(--ink);margin:5px 0 12px;outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--p2);box-shadow:0 0 0 4px rgba(167,139,250,.28);background:#fff}
textarea{min-height:76px;resize:vertical}.sel{width:auto;min-width:230px;margin:0 10px 14px 0;vertical-align:middle}
label{font-weight:700;display:block;font-size:13px;color:#4a4270}
.tw{overflow-x:auto;border-radius:20px}
table{border-collapse:collapse;width:100%}
th{background:rgba(167,139,250,.2);color:var(--pd);text-align:left;padding:12px 14px;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
td{padding:11px 14px;border-top:1px solid rgba(139,109,240,.12)}tbody tr:hover td{background:rgba(255,255,255,.55)}
.empty{text-align:center;padding:28px;color:var(--mut)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden}
#login:before,#login:after{content:"";position:absolute;border-radius:50%;filter:blur(10px);z-index:0}

#login:after{width:360px;height:360px;background:radial-gradient(circle at 60% 40%,#ffc2ea,#d8a8ff);right:9%;bottom:6%;opacity:.7}

.lbox .big{font-size:50px;line-height:1;margin-bottom:6px}.lbox h1{font-size:30px;background:linear-gradient(135deg,var(--p2),#d46bd0);-webkit-background-clip:text;background-clip:text;color:transparent}
#llogo img{height:88px;max-width:200px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(109,79,214,.25))}.lg0{font-size:52px}#slogo img{height:40px;max-width:64px;object-fit:contain}

#app{display:none;min-height:100vh}

.chk{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}

.pill:hover{border-color:var(--p2)}.pill input{width:auto;margin:0;accent-color:var(--p2)}

.lv{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.tabs{display:flex;gap:8px;margin:12px 0 18px;flex-wrap:wrap}.tabs .btn{margin:0}
.up{display:flex;gap:14px;align-items:center;margin-bottom:14px}.up img{height:68px;max-width:130px;border:1.5px dashed rgba(139,109,240,.5);border-radius:14px;background:rgba(255,255,255,.7);object-fit:contain;padding:4px}.up input{margin:0}
.photos{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 12px}.ph{position:relative}.ph img{height:92px;border-radius:16px;display:block;box-shadow:0 6px 16px rgba(109,79,214,.25)}
.ph .x{position:absolute;top:-8px;right:-8px;border:0;background:linear-gradient(135deg,#f58ac4,#d4509a);color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;font-weight:800;box-shadow:0 4px 10px rgba(212,80,154,.4)}
.addph{width:92px;height:92px;border:1.5px dashed rgba(139,109,240,.6);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:24px;background:rgba(255,255,255,.55);text-align:center;transition:.15s}.addph:hover{background:rgba(167,139,250,.2)}.addph small{font-size:11px;font-weight:700;color:var(--pd)}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(60,40,120,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.md{border-radius:26px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;padding:22px;background:rgba(255,255,255,.78)}
.mb{overflow:auto;padding:2px}.mf{text-align:right;padding-top:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(43,37,71,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;padding:11px 22px;border-radius:999px;z-index:50;display:none;font-weight:700;box-shadow:0 10px 30px rgba(43,37,71,.35)}
#busy{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#c4b0ff,#8b6df0,#f5b8e4,#8b6df0,#c4b0ff);background-size:200% 100%;animation:bz 1s linear infinite;z-index:60;display:none}
@keyframes bz{to{background-position:-200% 0}}
.btn.dg{background:linear-gradient(135deg,#f58ac4,#d4509a);box-shadow:0 6px 16px rgba(212,80,154,.35)}
.hero{background:linear-gradient(135deg,rgba(167,139,250,.35),rgba(245,184,228,.35));border-top:0}.hero h3{font-size:20px;margin:0 0 4px;color:var(--pd)}.hero p{margin:0;color:#4a4270}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.st{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--gb);box-shadow:var(--sh)}
.st b{display:block;font-size:24px;line-height:1.1}.st span{font-size:12.5px;color:var(--mut);font-weight:700}
.si{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.st.a .si{background:linear-gradient(135deg,#d9ccff,#a78bfa)}.st.b .si{background:linear-gradient(135deg,#cfe6ff,#7fb8f5)}.st.c .si{background:linear-gradient(135deg,#ffd6ef,#f5a0d6)}.st.d .si{background:linear-gradient(135deg,#d3f5e8,#7fd6c2)}.st.e .si{background:linear-gradient(135deg,#fff0c7,#ffc95e)}
.bar{height:10px;border-radius:99px;background:rgba(139,109,240,.18);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:99px;transition:width .5s}
.pg{margin:12px 0}.pgh{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}.pgh span{color:var(--mut);font-weight:700}
input.ti{width:130px;margin:0;padding:8px 10px}.md.wide{max-width:780px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
label.btn{color:var(--pd);font:700 13.5px 'Plus Jakarta Sans',sans-serif}
@media(max-width:640px){.fg{grid-template-columns:1fr}}
.eh{background:rgba(167,139,250,.2);color:var(--pd);padding:9px 14px;border-radius:14px;font-weight:800;font-size:15px;margin:2px 0 10px}
/* ---- cetak ---- */

.pbar{position:sticky;top:0;background:#fff;padding:8px 16px;border-bottom:3px solid var(--line)}
.rp{background:#fff;width:210mm;min-height:297mm;margin:12px auto;padding:15mm;color:#000;font:12pt/1.4 'Times New Roman',Times,serif;box-sizing:border-box;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.rp,.rp *{font-family:'Times New Roman',Times,serif}

.rp .hd p{margin:0;text-align:center;font-size:12pt}

.rp .lb{width:27%;font-weight:700}

@media print{@page{size:A4 portrait;margin:15mm}html,body{background:#fff!important;height:auto!important}#app,#login{display:none!important}body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;left:0;top:0;width:100%;overflow:visible;background:#fff}.pbar{display:none}.rp{margin:0;padding:0;width:auto;min-height:0;box-shadow:none;page-break-after:always}.rp:last-child{page-break-after:auto}}
@media(max-width:800px){#side{transform:translateX(-120%);transition:.25s;box-shadow:0 20px 60px rgba(60,40,120,.35)}#side.open{transform:none}#main{margin-left:0;padding:14px}#topbar{margin:10px 12px 0;top:10px;padding:8px 10px}.tgl{display:inline-block}#who{display:none}#ptitle{font-size:14px}.tr .btn{padding:8px 12px;font-size:12.5px}}

/* ===== animasi, tombol mata, loading ===== */
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(14px,-26px) rotate(10deg)}}
@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,-18px) scale(1.07)}}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-36px) rotate(-9deg)}55%{transform:translateY(-36px) rotate(9deg)}80%{transform:translateY(0) scaleY(.88)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.lbox{animation:rise .8s cubic-bezier(.2,.9,.3,1.15) both}
#llogo{animation:pop .9s .15s cubic-bezier(.2,.9,.3,1.3) both}
#llogo>*{display:inline-block;animation:bob 3.2s 1s ease-in-out infinite}
.lbox h1,.lbox p,.lbox input,.lbox .btn{animation:fin .6s both}
.lbox h1{animation-delay:.3s}.lbox p{animation-delay:.4s}.lbox input:nth-of-type(1){animation-delay:.5s}.lbox .pw,.lbox input:nth-of-type(2){animation-delay:.6s}.lbox .btn{animation-delay:.7s}
#login:before{animation:blob 9s ease-in-out infinite}#login:after{animation:blob 11s -3s ease-in-out infinite}
.fl{position:absolute;z-index:0;font-size:34px;opacity:.6;pointer-events:none;animation:drift 7s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(109,79,214,.2))}
#app{animation:fin .6s both}
#main>*{animation:fin .35s both}
#loader{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 520px at 8% -8%,#d9ccff 0,transparent 60%),radial-gradient(800px 520px at 100% 8%,#f9d3ee 0,transparent 55%),var(--bg);opacity:0;pointer-events:none;transition:opacity .35s}
#loader.on{opacity:1;pointer-events:auto}
.ld{text-align:center;width:min(86vw,340px)}
.ld small{display:block;margin-top:12px;color:var(--mut);font-weight:600}
.blocks{display:flex;gap:12px;justify-content:center;align-items:flex-end;height:96px;margin-bottom:20px}
.blocks b{width:56px;height:56px;border-radius:15px;display:flex;align-items:center;justify-content:center;font:800 28px 'Plus Jakarta Sans',sans-serif;color:#fff;box-shadow:0 10px 22px rgba(109,79,214,.28);animation:hop 1.15s ease-in-out infinite}
.blocks b:nth-child(1){background:linear-gradient(135deg,#c4b0ff,#8b6df0)}
.blocks b:nth-child(2){background:linear-gradient(135deg,#ffc2ea,#f058a8);animation-delay:.16s}
.blocks b:nth-child(3){background:linear-gradient(135deg,#a5d8ff,#4f9fee);animation-delay:.32s}
#ldt{font-weight:800;color:var(--pd);margin:0 0 12px;min-height:22px}
.spin{display:inline-block;width:14px;height:14px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:sp .7s linear infinite}
.btn.busy{opacity:.8;cursor:progress;pointer-events:none;transform:none}
.ib.busy{opacity:1}
.pw{position:relative;display:block;margin:5px 0 12px}
.pw input{margin:0;padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--pd);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0;opacity:.75}
.eye:hover{opacity:1;background:rgba(167,139,250,.18)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
